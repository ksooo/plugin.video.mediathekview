name: Unit tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  unittests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest Kodi that can run this addon carries Python 3.11 and
        # the newest 3.14 (tools/depends/target/python3 in each release).
        # Both have to stay happy.
        python-version: ['3.11', '3.14']
    name: Python ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Run each test module on its own
        # A module that passes only inside the full run depends on some other
        # module having imported something first.
        run: |
          for path in tests/test_*.py; do
            module=$(basename "$path" .py)
            echo "== tests.$module"
            python -m unittest "tests.$module"
          done
